[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyd-ark-storage-manager"
version = "0.1.0"
description = "Lyd Ark storage, automount, rclone and backup manager"
requires-python = ">=3.11"

[project.scripts]
lydstore = "lydstore.cli:main"

[tool.setuptools.packages.find]
include = ["lydstore*"]
